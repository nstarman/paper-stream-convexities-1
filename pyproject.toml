[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_convexity_paper"]

[project]
name = "Stream-Convexity-Paper"
version = "0.1.0"
description = "Code, data and figures for the stellar-stream convexities paper (showyourwork)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.2.0",
    "basemap>=2.0.0",
    "coordinax>=0.23.1",
    "equinox>=0.13.8",
    "galax",
    "interpax>=0.3.14",
    "jax>=0.10.0",
    "jax-tqdm>=0.4.0",
    "jaxmore>=0.3.0",
    "jaxtyping>=0.3.4",
    "matplotlib>=3.10.9",
    "numpy>=2.3.5",
    "plum-dispatch>=2.9.0",
    "potamides>=1.0.0",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "unxt>=1.11.0",
]


[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=8.4.0",
    "ruff>=0.14.9",
]


[tool.pytest.ini_options]
# The package is collected so the docstring examples run: they went stale unnoticed
# once. Not src/scripts: importing a figure script runs it (step_1 takes ~21 h).
testpaths = ["tests", "src/stream_convexity_paper"]
addopts = "-ra --doctest-modules"


[tool.ruff]
[tool.ruff.lint]
extend-select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and pytest collects them without an __init__.py.
"tests/*" = ["S101", "INP001"]

[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"
equinox = "eqx"
interpax = "ipx"
potamides = "ptd"
coordinax = "cx"
"coordinax.vecs" = "cxv"
unxt = "u"
"jax.tree" = "jtu"
"galax.coordinates" = "gc"
"galax.dynamics" = "gd"
"galax.potential" = "gp"


[tool.ruff.lint.isort]
combine-as-imports = true
sections = { typing = ["typing", "typing_extensions", "jaxtyping"] }
section-order = ["future", "standard-library", "typing", "third-party", "first-party", "local-folder"]
known-first-party = [
  "dataclassish",
  "is_annotated",
  "optional_dependencies",
  "quaxed",
  "unxt",
  "xmmutablemap",
  "zeroth",
]
known-local-folder = []

[tool.uv.sources]
galax = { git = "https://github.com/GalacticDynamics/galax.git", rev = "main" }
