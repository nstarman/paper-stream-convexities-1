name: tests

# The unit tests and the package's doctests (pyproject.toml's [tool.pytest]); no
# showyourwork build and no generated data, so this runs on any branch in ~2 min.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"  # as environment.yml
      - run: uv run --locked pytest
