name: build

on:
  # main only: zenodo.yml has a cache DOI for main (and HEAD, a pull request's merge
  # commit), so on another branch the cached rules (the ~21-h rate_dependence) would
  # run from scratch.
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build the article PDF
    # A normal build takes ~5 min; this stops an accidental run of a cached rule.
    timeout-minutes: 30
    permissions: write-all
    concurrency: "showyourwork-${{ github.ref }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive  # the LaTeX preamble (src/tex/preamble)

      - name: Build the article PDF
        id: build
        uses: showyourwork/showyourwork-action@9987603860836147f19f5022b902c2d43e7268e4
        with:
          showyourwork-spec: git+https://github.com/showyourwork/showyourwork@44d15103f64c3162e4a1a961f49f77d8e3634e49
          # 1: drop the cache saved with graphic.pdf as a dangling symlink (see Snakefile).
          article-cache-number: 1
        env:
          SANDBOX_TOKEN: "${{ secrets.SANDBOX_TOKEN }}"
          OVERLEAF_TOKEN: "${{ secrets.OVERLEAF_TOKEN }}"
