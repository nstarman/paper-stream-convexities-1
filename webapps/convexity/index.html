<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore a Stream Convexity</title>
<link rel="stylesheet" href="figpress-apps/index.css">
<style>
  body { margin: 0; background: var(--fk-bg); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; font-family: var(--fk-font); color: var(--fk-fg); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .cite { margin: 0 0 12px; color: var(--fk-muted); font-size: 13px; }
  .cite a { color: var(--fk-accent); }
  .fk-note { margin: 0 0 8px; color: var(--fk-muted); font-size: 12px; }
  /* The globe beside its sky panels, stacked in one column, down to card width; on a phone the
     globe on top and the panels side by side under it. */
  .fk-split > .fk-grid-2 { grid-template-columns: minmax(0, 1fr); }
  @container (min-width: 520px) and (max-width: 760px) { .fk-split { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); } }
  @container (max-width: 519px) { .fk-split > .fk-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* Side by side: the globe centred against the panels; the panels shorter (4:3) and alike, each
     readout on its own line. */
  @container (min-width: 520px) {
    .fk-split { align-items: center; }
    .fk-split > .fk-grid-2 .fk-plot { aspect-ratio: 4 / 3; }
    .fk-split > .fk-grid-2 .fk-panel-head { flex-direction: column; }
  }
</style>
</head>
<body>
<main>
  <h1>Explore a Stream Convexity</h1>
  <p class="cite">Built from the data of Paper Figure 4 of
    <a href="https://ui.adsabs.harvard.edu/abs/2026arXiv260940057S/abstract">Starkman et al. (2026)</a>.</p>
  <div id="app"></div>
</main>
<script type="module">
  import { run } from "figpress-apps/index.js";
  import app from "app/widget.js";
  run(app, document.getElementById("app"));
</script>
</body>
</html>
